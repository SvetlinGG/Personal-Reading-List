<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style/base.css">
    <title>Personal Reading List</title>
  </head>
  <body>
    <nav>
      <div class="navbar">
        <img class="book" src="/src/images/book-solid-full.svg" alt="book">
        <h1>Bookshelf</h1>
      </div>
      <input 
        id="search-shelves"   
        type="text" 
        name="search"
        class="border border-gray-300 rounded-md px-3 py-2 text-sm w-full" 
        placeholder="Search shelves" 
        />
      <h3>LIBRARY</h3>
      <div class="library-items">
        <div class="all-books">
          <a href="">All Books</a>
        </div>

        <div class="currently-reading">
          <a href="">Currently Reading</a>
        </div>

        <div class="want-to-read">
          <a href="">Want to Read</a>
        </div>

        <div class="read">
          <a href="">Read</a>
        </div>

        <div class="favorites">
          <a href="">Favorites</a>
        </div>
      </div>
      
    </nav>
    
    
  </body>
</html>
