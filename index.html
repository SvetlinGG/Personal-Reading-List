<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style/base.css">
    <title>Personal Reading List</title>
  </head>
  <body>
    <nav>
      <div class="navbar">
        <img class="book" src="/src/images/book-1.png" alt="">
        <h1>Bookshelf</h1>
      </div>
      <input 
        id="search-shelves"   
        type="text" 
        name="search"
        class="border border-gray-300 rounded-md px-3 py-2 text-sm w-full"
        placeholder= "Search shelves..." 
        />
      <h4>LIBRARY</h4>
      <div class="library-items">
        <div class="all-books">
          <img class="book-item" src="/src/images/book_2_32dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="book">
          <a href="">All Books</a>
        </div>

        <div class="currently-reading">
          <img class="open-book-item" src="/src/images/book_ribbon_32dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="open-book">
          <a href="">Currently Reading</a>
        </div>

        <div class="want-to-read">
          <img class="bookmark-item" src="/src/images/bookmark_32dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="bookmark">
          <a href="">Want to Read</a>
        </div>

        <div class="read">
          <img class="check-item" src="/src/images/check_32dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="check">
          <a href="">Read</a>
        </div>

        <div class="favorites">
          <img class="star-item" src="/src/images/star_32dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="star">
          <a href="">Favorites</a>
        </div>
      </div>
      
      <!-- Sidebar ends -->
       <div class="sidebar-end">
        <h4>READING GOAL</h4>

       </div>
    </nav>

    <header>
      <input class="search-books" type="text" name="search" placeholder="Search books...">
      <button class="btn-register">REGISTER</button>
    </header>
    
    
  </body>
</html>
